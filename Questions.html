<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions page</title>

    <link rel="stylesheet" href="questions.css">
    <script src="js/instascan.min.js"></script>
    <script src="cookies.js"></script>
</head>
<body>
<header id="header" style="display:flex; align-items:center; justify-content:flex-start; gap:10px; width:100%;">
    <img src="FinalLogo-removebg-preview.png" alt="WebBusters Logo" style="width:120px; height:auto;">
</header>
<div style="margin: 20px; padding: 20px; background-color: black; color: white; text-align: center;" id="content">
    Scan a QR code to get a hint...
</div>
<label class="switch">
    <input type="checkbox" id="cameraToggle">
    <span class="slider round"></span>
</label>
<div class="main-layout">
    <div class="question-card">
        <h1>Treasure Hunt Questions</h1>

        <div class="question-header">
            <h2>Treasure Hunt Question</h2>
            <div class="score-box">
                Score: <span id="score_container">0</span>
            </div>
        </div>

        <p id="question_text" class="question-text">Loading question...</p>
        <div id="answer_text" class="answers"></div>

        <p id="feedback_text" class="feedback" style="color:#111; font-weight:600;"></p>
    </div>

    <div class="camera-container">
        <video id="preview" autoplay muted playsinline></video>
    </div>
</div>

<script>
const session = getCookie("sessionId");

let requiresLocationQuestion = false;
let locationSentQuestion = false;
let pendingAnswer = "";

let cameraArray = [];
let cameraIndex = 0;

function setFeedback(msg, ok = null) {
    const fb = document.getElementById("feedback_text");
    fb.textContent = msg || "";

    if (ok === true) fb.style.color = "#118a3b";
    else if (ok === false) fb.style.color = "#c0392b";
    else fb.style.color = "#111";
}

function showPlayerScore() {
    fetch(`https://codecyprus.org/th/api/score?session=${session}`)
        .then(response => response.json())
        .then(jsonObject => {
            const score = document.getElementById('score_container');
            score.textContent = (typeof jsonObject.score === "undefined") ? "-" : jsonObject.score;
        })
        .catch(() => {});
}

function getQuestions() {
    fetch(`https://codecyprus.org/th/api/question?session=${session}`)
        .then(response => response.json())
        .then(jsonObject => {
            requiresLocationQuestion = (jsonObject.requiresLocation === true);
            locationSentQuestion = false;

            let displayQuestion = document.getElementById("question_text");
            let giveAnswer = document.getElementById("answer_text");

            giveAnswer.innerHTML = "";
            setFeedback("");

            if (jsonObject.status !== "OK") {
                displayQuestion.textContent = "No questions found!";
                setFeedback("No questions found.", false);
                return;
            }

            displayQuestion.innerHTML = (jsonObject.questionText || "").split("<br>")[0].trim();

            const input = document.createElement("input");
            input.id = "answer";

            // Keep MCQ as TEXT input because API often expects A/B/C/D manually
            if (jsonObject.questionType === "INTEGER" || jsonObject.questionType === "NUMERIC") {
                input.type = "number";
                input.placeholder = "Enter your answer";
            } else if (jsonObject.questionType === "BOOLEAN") {
                giveAnswer.innerHTML=
                    '<button onclick="submitButtonsAnswers(\'true\')">True</button>' +
                    '<button onclick="submitButtonsAnswers(\'false\')">False</button>';
                return;
            } else if (jsonObject.questionType === "MCQ") {
        giveAnswer.innerHTML =
            '<button onclick="submitButtonsAnswers(\'A\')">A</button>' +
            '<button onclick="submitButtonsAnswers(\'B\')">B</button>' +
            '<button onclick="submitButtonsAnswers(\'C\')">C</button>' +
            '<button onclick="submitButtonsAnswers(\'D\')">D</button>';
        return;
            } else {
                input.type = "text";
                input.placeholder = "Enter your answer";
            }

            giveAnswer.appendChild(input);

            const submitButton = document.createElement("button");
            submitButton.textContent = "Check";
            submitButton.id = "submit";
            submitButton.type = "button";
            submitButton.onclick = submitAnswers;
            giveAnswer.appendChild(submitButton);

            const skipButton = document.createElement("button");
            skipButton.textContent = "Skip Question";
            skipButton.type = "button";
            skipButton.onclick = skipQuestion;
            skipButton.id = "skipButton";
            giveAnswer.appendChild(skipButton);

            if (jsonObject.canBeSkipped === false) {
                skipButton.disabled = true;
                setFeedback("This question cannot be skipped.", null);
            }

            input.addEventListener("keydown", (e) => {
                if (e.key === "Enter")
                    submitAnswers();
            });

            showPlayerScore();
        })
        .catch(() => setFeedback("Network error while loading question.", false));
}
function submitButtonsAnswers(answer) {
    pendingAnswer = answer;
    submitAnswers();
}


function submitAnswers() {
    // let playersAnswers = document.getElementById("answer").value.trim();
    const answerInput = document.getElementById("answer");
    let playersAnswers = "";

    if (pendingAnswer) {
        playersAnswers = pendingAnswer;
    } else if (answerInput) {
        playersAnswers = answerInput.value.trim();
    }
    pendingAnswer = playersAnswers;
    if (answerInput)
        answerInput.value = "";

    if (!playersAnswers) {
        setFeedback("Please enter an answer.", false);
        return;
    }

    // Old working flow: if location needed, do location first
    if (requiresLocationQuestion && !locationSentQuestion) {
        sendLocationAndAnswerQuestion();
        return;
    }

    fetch(`https://codecyprus.org/th/api/answer?session=${session}&answer=${encodeURIComponent(playersAnswers)}`)
        .then(response => response.json())
        .then(jsonObject => {

            if (jsonObject.status !== "OK") {
                setFeedback(jsonObject.message || "Answer submission failed.", false);
                return;
            }

            if (jsonObject.correct === true) setFeedback("Correct ✅", true);
            else if (jsonObject.correct === false) setFeedback("Wrong ❌", false);
            else setFeedback(jsonObject.message || "Submitted.", null);
            pendingAnswer="";

            if (jsonObject.completed === false) {
                setTimeout(getQuestions, 250);
            } else {
                window.location.href = "leaderboard.html";
            }

            setTimeout(showPlayerScore, 350);
        })
        .catch(() => {
            setFeedback("Network error while submitting answer.", false);
        });
}

function skipQuestion() {
    fetch(`https://codecyprus.org/th/api/skip?session=${session}`)
        .then(response => response.json())
        .then(() => {
            getQuestions();
            setTimeout(showPlayerScore, 300);
        })
        .catch(() => setFeedback("Network error while skipping.", false));
}

// Keep location flow simple and close to original<script>
function getCurrentPositionAsync(options) {
    return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(resolve, reject, options);
    });
}

async function sendLocationAndAnswerQuestion() {
    if (!navigator.geolocation) {
        setFeedback("Geolocation is not supported by your browser.", false);
        return;
    }

    if (!pendingAnswer) {
        setFeedback("Please enter an answer first.", false);
        return;
    }

    setFeedback("Location required, getting your location...", null);

    try {
        const position = await getCurrentPositionAsync({
            enableHighAccuracy: false,
            timeout: 10000,
            maximumAge: 30000
        });

        await showPosition(position);
    } catch (err) {
        const msg =
            err?.code === 1 ? "Permission denied." :
                err?.code === 2 ? "Position unavailable." :
                    err?.code === 3 ? "Request timed out." :
                        (err?.message || "Unknown error.");
        setFeedback(`Location failed: ${msg}`, false);
    }
}

async function showPosition(position) {
    try {
        const lat = position?.coords?.latitude;
        const lng = position?.coords?.longitude;

        if (typeof lat !== "number" || typeof lng !== "number") {
            setFeedback("Invalid location coordinates.", false);
            return;
        }

        const locRes = await fetch(
            `https://codecyprus.org/th/api/location?session=${encodeURIComponent(session)}&latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lng)}`,
            { cache: "no-store" }
        );
        if (!locRes.ok) throw new Error(`Location HTTP ${locRes.status}`);

        const locJson = await locRes.json();
        if (locJson.status !== "OK") {
            setFeedback(locJson.message || "Location rejected.", false);
            return;
        }

        locationSentQuestion = true;

        const ansRes = await fetch(
            `https://codecyprus.org/th/api/answer?session=${encodeURIComponent(session)}&answer=${encodeURIComponent(pendingAnswer)}`,
            { cache: "no-store" }
        );
        if (!ansRes.ok) throw new Error(`Answer HTTP ${ansRes.status}`);

        const ans = await ansRes.json();
        if (ans.status !== "OK") {
            setFeedback(ans.message || "Answer submission failed.", false);
            return;
        }

        if (ans.correct === true) setFeedback("Correct ✅", true);
        else if (ans.correct === false) setFeedback("Wrong ❌", false);
        else setFeedback(ans.message || "Submitted.", null);

        if (ans.completed === false) setTimeout(getQuestions, 250);
        else window.location.href = "leaderboard.html";

        setTimeout(showPlayerScore, 350);
    } catch (err) {
        setFeedback(`Network error: ${err.message}`, false);
    }
}

let scanner = new Instascan.Scanner({///this need editingg more (gaith)
    video: document.getElementById("preview")
});

scanner.addListener('scan', function (content) {
    document.getElementById("content").textContent = content;
    setFeedback("QR code scanned.", true);
});

document.getElementById("cameraToggle").addEventListener("change", function () {
    if (this.checked) {
        Instascan.Camera.getCameras().then(function (cameras) {
            if (cameras.length > 0) {
                scanner.start(cameras[0]);
            } else {
                setFeedback("No camera found.", false);
                document.getElementById("cameraToggle").checked = false;
            }
        }).catch(function () {
            setFeedback("Could not open camera.", false);
            document.getElementById("cameraToggle").checked = false;
        });
    } else {
        scanner.stop();
        document.getElementById("preview").srcObject = null;
    }
});

getQuestions();
showPlayerScore();

</script>




<footer id="footer"></footer>
</body>
</html>
