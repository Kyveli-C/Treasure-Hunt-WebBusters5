<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions page</title>

    <link rel="stylesheet" href="questions.css">
    <script src="js/instascan.min.js"></script>
    <script src="cookies.js"></script>
    <!--PWA-->
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
    <meta name="theme-color" content="green"/>
    <link rel="icon" href="FinalLogo-removebg-preview.png" type="image/x-icon" />
    <link rel="apple-touch-icon" href="FinalLogo-removebg-preview.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="teal">
    <meta name="apple-mobile-web-app-title" content="Simple app">
    <meta name="msapplication-TileImage" content="logo.png">
    <meta name="msapplication-TileColor" content="#008080">
</head>
<body>
<header id="header" style="display:flex; align-items:center; justify-content:flex-start; gap:10px; width:100%;">
    <img src="FinalLogo-removebg-preview.png" alt="WebBusters Logo" style="width:120px; height:auto;">
</header>
<div style="margin: 20px; padding: 20px; background-color: black; color: white; text-align: center;" id="content">
    Scan a QR code to get a hint...
</div>
<label class="switch">
    <input type="checkbox" id="cameraToggle">
    <span class="slider round"></span>
</label>
<div class="main-layout">
    <div class="question-card">
        <h1>Treasure Hunt Questions</h1>

        <div class="question-header">
            <h2>Treasure Hunt Question</h2>
            <div class="score-box">
                Score: <span id="score_container">0</span> <!--start with 0 points-->
            </div>
        </div>

        <p id="question_text" class="question-text">Loading question...</p>
        <div id="answer_text" class="answers"></div>

        <p id="feedback_text" class="feedback" style="color:yellow; font-weight:600;"></p>
    </div>

    <div class="camera-container">
        <video id="preview" autoplay muted playsinline></video>
    </div>
</div>

<script>
const session = getCookie("sessionId");

let requiresLocationQuestion = false;
let locationSentQuestion = false;
let pendingAnswer = "";


//function to display a feedback
function setFeedback(msg) {
    let feedback=document.getElementById("feedback_text");
}

function showPlayerScore()
{
    fetch(`https://codecyprus.org/th/api/score?session=${session}`)
        .then(response => response.json())
        .then(jsonObject => {
            console.log(jsonObject);

            let score=document.getElementById('score_container');
            score.innerHTML=jsonObject.score;

            if(jsonObject.status!="OK")
            {
                score.innerHTML="Error Loading Score!";
            }

        });
}

function getQuestions()
{
    fetch(`https://codecyprus.org/th/api/question?session=${session}`)
        .then(response => response.json())
        .then(jsonObject => {
            console.log(jsonObject);

            if (jsonObject.status === "OK")
            {
                const question = jsonObject.questionText;
                document.getElementById("question_text").textContent = question;
            }
            else
            {
                document.getElementById("question_text").textContent ="No questions found!";
            }


            requiresLocationQuestion = (jsonObject.requiresLocation === true);
            locationSentQuestion = false;

             let giveAnswer = document.getElementById("answer_text");

            giveAnswer.innerHTML = "";
            setFeedback("");
            if (jsonObject.questionType === "BOOLEAN") {
                giveAnswer.innerHTML =
                    '<button onclick="submitButtonsAnswers(\'true\')">True</button>' +
                    '<button onclick="submitButtonsAnswers(\'false\')">False</button>'+
                '<button onclick="skipQuestion()">Skip Question</button>' ;

                showPlayerScore();
                return;
            }

            if (jsonObject.questionType === "MCQ") {
                giveAnswer.innerHTML =


                    '<button onclick="submitButtonsAnswers(\'A\')">A</button>' +
                    '<button onclick="submitButtonsAnswers(\'B\')">B</button>' +
                    '<button onclick="submitButtonsAnswers(\'C\')">C</button>' +
                    '<button onclick="submitButtonsAnswers(\'D\')">D</button>'+
                '<button onclick="skipQuestion()">Skip Question</button>';

                showPlayerScore();
                return;
            }

            let input = document.createElement("input");
            input.id = "answer";

            if (jsonObject.questionType === "INTEGER" || jsonObject.questionType === "NUMERIC") {
                input.type = "number";
            } else {
                input.type = "text";
            }

            input.placeholder = "Enter your answer";
            giveAnswer.appendChild(input);

            let submitButton = document.createElement("button");
            submitButton.textContent = "Check";
            submitButton.id = "submit";
            submitButton.type = "button";
            submitButton.onclick = submitAnswers;
            giveAnswer.appendChild(submitButton);

            let skipButton = document.createElement("button");
            skipButton.textContent = "Skip Question";
            skipButton.type = "button";
            skipButton.onclick = skipQuestion;
            skipButton.id = "skipButton";
            giveAnswer.appendChild(skipButton);

            if (jsonObject.canBeSkipped === false) {
                //skipButton.disabled = true;
                setFeedback("This question cannot be skipped.");
            }

            showPlayerScore();
        })

}

function submitButtonsAnswers(answer) {
    pendingAnswer = answer;
    submitAnswers();
}

function submitAnswers() {
    let answerInput = document.getElementById("answer");
    let playersAnswers = ""; //clear the previous

    if (pendingAnswer) {
        playersAnswers = pendingAnswer.trim(); //used trim because we used type number- it removes any extra spaces so that API can read the number correctly
    } else if (answerInput) {
        playersAnswers = answerInput.value.trim();
    }

    pendingAnswer = playersAnswers;

    if (answerInput) {
        answerInput.value = "";
    }

    if (!playersAnswers) {
       // setFeedback("Please enter an answer.", false);
        feedback.innerHTML="Please enter an answer";
        return;
    }

    if (requiresLocationQuestion && !locationSentQuestion) {
        sendLocationAndAnswerQuestion();
        return;

    }

    fetch("https://codecyprus.org/th/api/answer?session=" + session + "&answer=" + playersAnswers)
        .then(function (response) {
            return response.json();
        })
        .then(function (jsonObject) {
            let feedback=document.getElementById("feedback_text");

            if (jsonObject.status !== "OK") {
                feedback.textContent="Answer submission failed";
                return;

            }
            else
            {
                feedback.textContent=jsonObject.message;
            }

            pendingAnswer = "";

            if(jsonObject.completed===true) {
                window.location.href = "leaderboard.html";

            } else {
                getQuestions();
            }

        });
    }


function skipQuestion() {
    fetch("https://codecyprus.org/th/api/skip?session=" + session)
        .then(response => response.json())
        .then(jsonObject => {
            console.log(jsonObject);

    if(jsonObject.completed===true) {
        window.location.href = "leaderboard.html";

    } else {
        getQuestions();
    }
        });
}

function sendLocationAndAnswerQuestion() {
    if (!navigator.geolocation) {
        setFeedback("Geolocation is not supported by your browser.");
        return;
    }

    if (!pendingAnswer) {
        setFeedback("Please enter an answer first.");
        return;
    }

    setFeedback("Location required, getting your location...");

    navigator.geolocation.getCurrentPosition(
        function (position) {
            showPosition(position);
        },
        function (error) {
            if (error.code === 1) {
                setFeedback("Location failed: Permission denied.");
            } else if (error.code === 2) {
                setFeedback("Location failed: Position unavailable.");
            } else if (error.code === 3) {
                setFeedback("Location failed: Request timed out.");
            } else {
                setFeedback("Location failed: Unknown error.");
            }
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 30000 }
    );
}

function showPosition(position) {
    let lat = position.coords.latitude;
    let lng = position.coords.longitude;


    if (lat == null || lng == null) {
        setFeedback("Invalid location.");
        return;
    }

    let locationUrl =
        "https://codecyprus.org/th/api/location?session=" + session +
        "&latitude=" + lat +
        "&longitude=" + lng;

    fetch(locationUrl)
        .then(function (response) {
            return response.json();
        })
        .then(function (locJson) {
            if (locJson.status !== "OK") {
                setFeedback(locJson.message || "Location rejected.", false);
                return null;
            }

            locationSentQuestion = true;

            return fetch("https://codecyprus.org/th/api/answer?session=" + session + "&answer=" + pendingAnswer);
        })
        .then(function (response) {
            if (!response) {
                return null;
            }
            return response.json();
        })
        .then(function (ans) {
            if (!ans) {
                return;
            }

            if (ans.status !== "OK") {
                setFeedback(ans.message || "Answer submission failed.");
                return;
            }

            pendingAnswer = "";

          // if(ans)
          // {
          //     window.location.href="leaderboard.html";
          // }
          // else
          // {
          //     getQuestions();
          // }
        })

    // setFeedback("Network error.");

}

//sendLocationAndAnswerQuestion();


let scanner = new Instascan.Scanner({
    video: document.getElementById("preview")
});

scanner.addListener("scan", function (content) {
    document.getElementById("content").textContent = content;
    setFeedback("QR code scanned.");
});

document.getElementById("cameraToggle").addEventListener("change", function () {
    if (this.checked) {
        Instascan.Camera.getCameras().then(function (cameras) {
            if (cameras.length > 0) {
                scanner.start(cameras[0]);
            } else {
                setFeedback("No camera found.");
                document.getElementById("cameraToggle").checked = false;
            }
        })
            setFeedback("Could not open camera.");
            document.getElementById("cameraToggle").checked = false;

    } else {
        scanner.stop();
        document.getElementById("preview").srcObject = null;
    }
});


getQuestions();
showPlayerScore();
</script>
<footer id="footer"></footer>
</body>
</html>
